# .github/workflows/trading_bot.yml
#
# Runs the headless bot on US market hours (Mon–Fri, 9:30 AM–4 PM ET).
# GitHub Actions runs in UTC, so ET offsets are applied:
#   EST (UTC-5): market open = 14:30, close = 21:00
#   EDT (UTC-4): market open = 13:30, close = 20:00
#
# The schedule below covers both offsets conservatively:
#   start at 13:25 UTC (5 min before EDT open)
#   the bot checks market status itself and skips if closed.

name: Trading Bot

on:
  schedule:
    # Start just before market open (Mon–Fri), covers EDT and EST
    - cron: "25 13 * * 1-5"   # ~9:25 AM EDT  /  8:25 AM EST
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  run-bot:
    name: Run headless trading bot
    runs-on: ubuntu-latest
    timeout-minutes: 390       # 6.5 hours — covers full market session + buffer

    env:
      APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            alpaca-py \
            python-dotenv \
            pandas

      - name: Run bot
        run: python bot.py